<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="WDD 131 – Dynamic form with HTML, CSS, and JavaScript - Ibekwe Chidera - This is a sample homepage.">
    <meta name="author" content="Ibekwe Chidera Kizito">
    <link href="styles/form.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
    <title>WDD 131 - Dynamic form - Ibekwe Chidera</title>
    
</head>

<body>
    <!-- HEADER HERE -->
    <header>
        <h1>Product Review</h1>
    </header>

    <!-- CONTENT HERE -->
    <main>
        <form action="review.html" method="get" class="wf1">


            <div class="select-area">
                <label for="product">Product Name</label>
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product .. &#9662; </option>
                </select>
            </div>
            <!-- overall rating -->
            <div>
                <fieldset>
                    <legend>Overall Rating</legend>
                    <label for="star1"> <input type="radio" name="rating" value="1" id="star1" required>&star;</label>
                    <label for="star2"> <input type="radio" name="rating" value="2" id="star2" required>&star;&star;</label>
                    <label for="star3"> <input type="radio" name="rating" value="3" id="star3"
                            required>&star;&star;&star;</label>
                    <label for="star4"> <input type="radio" name="rating" value="4" id="star4"
                            required>&star;&star;&star;&star;</label>
                    <label for="star5"> <input type="radio" name="rating" value="5" id="star5"
                            required>&star;&star;&star;&star;&star;</label>
                </fieldset>
            </div>
            <!-- Date -->
            <div class="date">
                <label for="completeDate">Anticipated Completion Date</label>
                <input type="date" name="completeDate" id="completeDate" required>
            </div>

            <!-- Checkbox area -->
            <div class="checkbox-area">
                <label for="like1">What did you like about the product?</label>
                <label for="like1"> <input type="checkbox" name="like" value="1" id="like1"> Ease of Use</label>
                <label for="like2"> <input type="checkbox" name="like" value="2" id="like2"> Features</label>
                <label for="like3"> <input type="checkbox" name="like" value="3" id="like3"> Performance</label>
                <label for="like4"> <input type="checkbox" name="like" value="4" id="like4"> Design</label>
                <label for="like5"> <input type="checkbox" name="like" value="5" id="like5"> Support</label>
            </div>
            <!-- Textarea area -->
            <div class="textarea-area">
                <label for="comments">Written Review</label>
                <textarea name="comments" id="comments"  rows="8" ></textarea>
            </div>

            <!-- user name -->
            <div class="user-name">
                <label for="userName">Your Name</label>
                <input type="text" name="userName" id="userName" >
            </div>
            <!-- submit button -->
            <input type="submit" value="Post Review" class="submit-btn">


        </form>
    </main>

    <!-- footer -->
    <footer>
        <p>&copy; <span id="current-year">2026</span> | Ibekwe Chidera | Nigeria</p>
        <p>last modified: <span id="last-modified">2026-06-15</span></p>
    </footer>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="WDD 131 – Dynamic form with HTML, CSS, and JavaScript - Ibekwe Chidera - This is a sample homepage.">
    <meta name="author" content="Ibekwe Chidera Kizito">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
    <title>WDD 131 - Dynamic form - Ibekwe Chidera</title>
    <link href="styles/form.css" rel="stylesheet">




</head>

<body>
    <!-- HEADER HERE -->
    <header>
        <h1>Product Review</h1>
    </header>

    <!-- CONTENT HERE -->
    <main>
        <form action="review.html" method="get" class="wf1">


            <div class="select-area">
                <h2>Product Name</h2>
                <select name="product" id="product" required>
                    <option value="" disabled selected >Select a Product .. &#9662; </option>
                </select>
            </div>
            <!-- overall rating -->
            <div>
                <h2>Overall Rating</h2>
                <label for=""> <input type="radio" name="rating" value="1" required >&star;</label>
                <label for=""> <input type="radio" name="rating" value="2" required>&star;&star;</label>
                <label for=""> <input type="radio" name="rating" value="3" required>&star;&star;&star;</label>
                <label for=""> <input type="radio" name="rating" value="4" required>&star;&star;&star;&star;</label>
                <label for=""> <input type="radio" name="rating" value="5" required>&star;&star;&star;&star;&star;</label>
            </div>
            <!-- Date -->
            <div class="date">
                <label for="">Anticipated Complation Date <input type="date" name="completeDate" id="" required> </label>
            </div>

            <!-- Checkbox area -->
            <div class="checkbox-area">
                <h2>What did you like about the product?</h2>
                <label for=""> <input type="checkbox" name="like" value="1"> Ease of Use</label>
                <label for=""> <input type="checkbox" name="like" value="2"> Features</label>
                <label for=""> <input type="checkbox" name="like" value="3"> Performance</label>
                <label for=""> <input type="checkbox" name="like" value="4"> Design</label>
                <label for=""> <input type="checkbox" name="like" value="5"> Support</label>
            </div>
            <!-- Textarea area -->
            <div class="textarea-area">
                <h2>Written Review </h2>
                <textarea name="comments" id="" cols="50" rows="10" required></textarea>
            </div>
  
            <!-- user name -->
            <div class="user-name">
                <label for="">Your Name <input type="text" name="userName" id="" required></label>
            </div>
            <!-- submit button -->
            <input type="submit" value="Post Review" class="submit-btn">


        </form>
    </main>

   <!-- footer -->
         <footer>
            <p>&copy; <span id="current-year">2026</span> | Ibekwe Chidera | Nigeria</p>
            <p>last modified: <span id="last-modified">2026-06-15</span></p>
        </footer>
</body>

</html>
